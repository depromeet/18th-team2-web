name: Auto Assign Reviewers

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  assign-reviewers:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Assign author and reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const codeowners = ['hjlee2778', 'xxxjinn'];
            const author = context.payload.pull_request.user.login;
            const reviewers = codeowners.filter(u => u !== author);
            const prNumber = context.payload.pull_request.number;

            // PR 작성자를 assignee로 할당
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              assignees: [author],
            });

            // 리뷰어 한 명씩 할당 (실패해도 나머지 진행)
            for (const reviewer of reviewers) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: [reviewer],
                });
                core.info(`✅ ${reviewer} 리뷰어 할당 성공`);
              } catch (e) {
                core.warning(`⚠️ ${reviewer} 리뷰어 할당 실패: ${e.message}`);
              }
            }
