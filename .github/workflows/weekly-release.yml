name: Weekly Release

on:
  schedule:
    - cron: '0 12 * * 4' # 매주 목요일 21:00 KST
  workflow_dispatch: # 수동 트리거

permissions:
  contents: read
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff
        id: diff
        run: |
          DIFF=$(git rev-list --count origin/main..origin/dev)
          echo "count=$DIFF" >> $GITHUB_OUTPUT

      - name: Check existing release PR
        if: steps.diff.outputs.count != '0'
        id: existing
        run: |
          URL=$(gh pr list --base main --head dev --state open --json url --jq '.[0].url')
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        if: steps.diff.outputs.count != '0' && steps.existing.outputs.url == ''
        id: log
        run: |
          BODY=$(
            gh pr list --base dev --state merged --limit 100 --json number,title,mergeCommit |
              jq -r '.[] | [.number, .title, .mergeCommit.oid] | @tsv' |
              while IFS=$'\t' read -r NUMBER TITLE SHA; do
                if git merge-base --is-ancestor "$SHA" origin/dev &&
                  ! git merge-base --is-ancestor "$SHA" origin/main; then
                  printf -- '- #%s %s\n' "$NUMBER" "$TITLE"
                fi
              done
          )

          if [ -z "$BODY" ]; then
            BODY=$(git log --format='- %s (%h)' origin/main..origin/dev)
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create weekly release PR
        if: steps.diff.outputs.count != '0' && steps.existing.outputs.url == ''
        run: |
          gh pr create \
            --base main --head dev \
            --title "release: $(TZ=Asia/Seoul date +%Y-%m-%d) 주간 릴리즈" \
            --body "## 📦 이번 주 변경사항
          $RELEASE_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.log.outputs.body }}
